[package]
name = "noid_sync_apply"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noid_chain       = { path = "../noid_chain" }
noid_mempool     = { path = "../noid_mempool" }
noid_wallet      = { path = "../noid_wallet" }
noid_networking  = { path = "../noid_networking" }
noid_poseidon2b  = { path = "../noid_poseidon2b" }
noid_recursive   = { path = "../noid_recursive" }

libp2p = { version = "0.55", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "identify", "ping", "macros"] }
tokio = { workspace = true }
tracing = "0.1"
