[package]
name        = "noid-extminer"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "External Blake3 PoW miner for the Paranoid blockchain"
default-run = "noid-extminer"

[[bin]]
name = "noid-extminer"
path = "src/main.rs"

[dependencies]
# PoW hashing
blake3     = "1"
rayon      = "1"

# HTTP / JSON-RPC
reqwest    = { version = "0.12", features = ["blocking", "json"] }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
hex    = "0.4"
anyhow = "1"
