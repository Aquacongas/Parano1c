name: Platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer manual run supersedes an older validation of the same branch.
  group: platform-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libclang-dev cmake pkg-config qemu-user

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Show compiler and CPU
        run: |
          rustc -vV
          cargo -vV
          lscpu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the portable x86-64 release profile
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
            -C target-cpu=x86-64
        run: >-
          cargo check --locked --workspace --all-targets
          --target x86_64-unknown-linux-gnu

      - name: Link the official node tools and GUI wallet
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
            -C target-cpu=x86-64
        run: >-
          cargo build --locked --target x86_64-unknown-linux-gnu
          -p noid_node -p noid-extminer -p noid_gui --bins

      - name: Smoke-test native executables
        run: |
          target/x86_64-unknown-linux-gnu/debug/parano1d --check-hardware
          target/x86_64-unknown-linux-gnu/debug/parano1d --help
          target/x86_64-unknown-linux-gnu/debug/parano1d-cli --help
          target/x86_64-unknown-linux-gnu/debug/parano1d-miner --check-hardware
          target/x86_64-unknown-linux-gnu/debug/parano1d-miner --help
          target/x86_64-unknown-linux-gnu/debug/parano1d-gui --release-self-check

      - name: Reject a legacy virtual CPU without illegal instructions
        shell: bash
        run: |
          set +e
          legacy_output="$(
            qemu-x86_64 -cpu qemu64 \
              target/x86_64-unknown-linux-gnu/debug/parano1d \
              --check-hardware 2>&1
          )"
          legacy_status=$?
          set -e
          test "$legacy_status" -ne 0
          test "$legacy_status" -ne 132
          grep -q "CPU UNSUPPORTED" <<<"$legacy_output"

      - name: Test GUI wallet logic
        run: cargo test --locked --release -p noid_gui

      - name: Test proof kernels with runtime dispatch
        run: >-
          cargo test --locked --release
          -p noid_core -p noid_poseidon2b -p noid-ivc-core

      - name: Test the runtime PCLMUL production floor
        env:
          NOID_CPU_BACKEND: pclmul
        run: >-
          cargo test --locked --release
          -p noid_core -p noid_poseidon2b -p noid-ivc-core

      - name: Cross-check scalar field and hash references
        env:
          NOID_CPU_BACKEND: scalar
        run: >-
          cargo test --locked --release
          -p noid_core -p noid_poseidon2b

  native-platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            release_flags: ""
            test_flags: ""
            backend: neon-pmull
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            release_flags: ""
            test_flags: ""
            backend: neon-pmull
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            release_flags: -C target-cpu=x86-64
            test_flags: ""
            backend: pclmul
          - name: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            release_flags: -C target-cpu=x86-64
            test_flags: ""
            backend: auto

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libclang-dev cmake pkg-config

      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        run: |
          libclang_path="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$libclang_path/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"
          clang --version

      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangPath = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "libclang.dll was not found in $libclangPath"
          }
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          clang --version

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Show compiler and CPU
        shell: bash
        run: |
          rustc -vV
          cargo -vV
          uname -a || true
          if command -v lscpu >/dev/null 2>&1; then lscpu; fi

      - name: Check the complete platform release profile
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && matrix.release_flags || '' }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && matrix.release_flags || '' }}
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: ${{ matrix.target == 'x86_64-apple-darwin' && matrix.release_flags || '' }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && matrix.release_flags || '' }}
        run: >-
          cargo check --locked --workspace --all-targets
          --target ${{ matrix.target }}

      - name: Link the official node tools and GUI wallet
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && matrix.release_flags || '' }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && matrix.release_flags || '' }}
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: ${{ matrix.target == 'x86_64-apple-darwin' && matrix.release_flags || '' }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && matrix.release_flags || '' }}
        run: >-
          cargo build --locked --target ${{ matrix.target }}
          -p noid_node -p noid-extminer -p noid_gui --bins

      - name: Smoke-test native executables
        shell: bash
        run: |
          suffix=
          if [[ "${{ runner.os }}" == Windows ]]; then suffix=.exe; fi
          target/${{ matrix.target }}/debug/parano1d$suffix --check-hardware
          target/${{ matrix.target }}/debug/parano1d$suffix --help
          target/${{ matrix.target }}/debug/parano1d-cli$suffix --help
          target/${{ matrix.target }}/debug/parano1d-miner$suffix --check-hardware
          target/${{ matrix.target }}/debug/parano1d-miner$suffix --help
          target/${{ matrix.target }}/debug/parano1d-gui$suffix --release-self-check

      - name: Test native proof kernels
        env:
          NOID_CPU_BACKEND: ${{ matrix.backend }}
          RUSTFLAGS: ${{ matrix.test_flags }}
        run: >-
          cargo test --locked --release
          -p noid_core -p noid_poseidon2b -p noid-ivc-core
