name: AVX-512 Validation

on:
  workflow_dispatch:
    inputs:
      run_history_step:
        description: Run the production HistoryStep benchmark from a prebuilt canonical pack
        required: true
        type: boolean
        default: false
      pack_dir:
        description: Absolute canonical-pack path on the self-hosted runner
        required: true
        type: string
        default: /opt/paranoid/history-step-pack
      history_class:
        description: HistoryStep benchmark case
        required: true
        type: choice
        options:
          - B64
          - B255
          - B64-B255
          - B255-B255
        default: B64
      samples:
        description: Production benchmark samples (1-100)
        required: true
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: avx512-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq,+vpclmulqdq

jobs:
  validate:
    name: Native AVX-512 kernels
    runs-on:
      - self-hosted
      - linux
      - x64
      - avx512
      - vpclmul
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate runner ISA
        shell: bash
        run: |
          set -euo pipefail
          lscpu
          flags="$(grep -m1 '^flags' /proc/cpuinfo)"
          for feature in avx2 pclmulqdq vpclmulqdq avx512f avx512bw; do
            if [[ " $flags " != *" $feature "* ]]; then
              echo "required CPU feature is missing: $feature" >&2
              exit 1
            fi
          done

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Test forced AVX-512 dispatch
        env:
          NOID_CPU_BACKEND: avx512
        run: >-
          cargo test --locked --release
          -p noid_core -p noid_poseidon2b -p noid-ivc-core

      - name: Run production HistoryStep benchmark
        if: inputs.run_history_step
        shell: bash
        env:
          NOID_CPU_BACKEND: avx512
          NOID_HISTORY_STEP_BENCH_FILTER: ${{ inputs.history_class }}
          NOID_HISTORY_STEP_BENCH_SAMPLES: ${{ inputs.samples }}
          PACK_DIR: ${{ inputs.pack_dir }}
        run: |
          set -euo pipefail
          if [[ ! "$NOID_HISTORY_STEP_BENCH_SAMPLES" =~ ^([1-9]|[1-9][0-9]|100)$ ]]; then
            echo "samples must be in 1..=100" >&2
            exit 1
          fi
          if [[ ! -d "$PACK_DIR/v1" || ! -f "$PACK_DIR/pins.env" ]]; then
            echo "canonical pack is incomplete: $PACK_DIR" >&2
            exit 1
          fi
          source "$PACK_DIR/pins.env"
          export NOID_HISTORY_STEP_PACK_DIR="$PACK_DIR"
          cargo bench --locked -p bench_prover --bench history_step_proof
