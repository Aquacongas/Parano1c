[package]
name = "bench_prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

noid_core = { path = "../noid_core" }
noid_fri = { path = "../noid_fri" }
noid_poseidon2b = { path = "../noid_poseidon2b" }
noid_air = { path = "../noid_air" }
noid_stark = { path = "../noid_stark" }
noid_ivc = { path = "../noid_ivc" }
noid_tx = { path = "../noid_tx" }
noid_binius = { path = "../noid_binius" }
noid_chain = { path = "../noid_chain" }

[[bench]]
name = "bench_prover"
harness = false

[[bench]]
name = "release_report"
harness = false

[[bench]]
name = "blockchain_report"
harness = false

[[bench]]
name = "air_bench"
harness = false

[[bench]]
name = "binius_packing"
harness = false
