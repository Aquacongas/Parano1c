[package]
name = "noid_wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
noid_chain      = { path = "../noid_chain" }
noid_core       = { path = "../noid_core" }
noid_gkr        = { path = "../noid_gkr" }
noid_poseidon2b = { path = "../noid_poseidon2b" }
noid_tx         = { path = "../noid_tx" }

serde      = { workspace = true }
serde_json = { workspace = true }

rand    = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex     = "0.4"
thiserror = "2"
tracing = "0.1"
libc = "0.2"


[dev-dependencies]
tempfile = "3"
static_assertions = "1"

