[workspace]
members = [
    "bench_prover",
    "noid_core",
    "noid_fri",
    "noid_fri_binius",
    "noid_poseidon2b",
    "noid_ivc_core",
    "noid_ivc_prover",
    "noid_tx",
    "noid_chain",
    "noid_gkr",
    "noid_block",
    "noid_recursive",
    # Node Infrastructure
    "noid_mempool",
    "noid_miner",
    "noid_p2p",
    "noid_rpc",
    "noid_node",
    # External tools
    "noid_extminer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "1"
